<!doctype html>
    <html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport"
          content="width=device-width, user-scalable=no, initial-scale=1.0, maximum-scale=1.0, minimum-scale=1.0">
    <meta http-equiv="X-UA-Compatible" content="ie=edge">
    <script src="https://ajax.googleapis.com/ajax/libs/jquery/3.7.1/jquery.min.js"></script>
    <script src="https://cdn.jsdelivr.net/gh/Fortnite-API/nodejs-wrapper@1.1.0-web/FNAPIcom.js"></script>
    <title>v41's branch</title>
</head>
<body>
<pre id="response"></pre>
<h1>yo, hi!!</h1>
<hr>
<p>smth</p>
<hr>
<button class="btnonetwo">PRESS ON ME!!</button>
<script>
$(document).ready(function(){
    $(".btnonetwo").click(function(){
        $.ajax({
            url: "https://fortnite-api.com/v2/shop?limit=30",
            datatype: "json",
            method: "GET",
            success: function(result){
                const boredElem = document.getElementById("asdasds") || document.querySelector(".boredinfo");
                boredElem.innerHTML = `
                <div class="asdbtn"><h1>${result.data.entries.1.devName}: Price: ${result.data.entries.1.finalprice}</h1></div>
                `;
                console.log(result.data.entries)
            },
            error: function(xhr){
                console.log(xhr.statusText)
            }
        });
    })
})
</script>
<div id="asdasds"></div>
</body>
</html>
